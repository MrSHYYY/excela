<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Excela</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header>
    <img src="logo.png" width="30" height="30" alt="">
    <strong>excela<span>.</span></strong>
    <button id="new-chat" type="button" title="New chat" aria-label="Start a new chat" hidden>＋</button>
    <button id="website" type="button" aria-label="Open Excela website">↗</button>
  </header>
  <p id="planner">Connecting to Excela…</p>
  <div class="environment"><label for="site">Connect to</label><select id="site" disabled><option value="https://excela.cfat.site">Live · excela.cfat.site</option><option value="https://localhost:3000">Local · localhost:3000</option></select></div>
  <div id="loading" aria-label="Checking your account" role="status"><span></span><span></span></div>

  <div id="chat" hidden>
    <div id="messages" role="log" aria-live="polite"></div>
    <div id="empty-state">
      <p>Ask Excela about your planner.</p>
      <span>“What do I have today?” · “Add CSE340 quiz Friday at 10am” · “Move my quiz to Monday”</span>
    </div>
  </div>

  <form id="form" hidden>
    <div id="page-context">
      <label><input type="checkbox" id="include-page"><span id="page-label">Include this page</span></label>
    </div>
    <div class="row">
      <textarea id="message" rows="2" maxlength="4000" placeholder="Ask Excela…" required disabled></textarea>
      <button id="send" type="submit" disabled aria-label="Send">↗</button>
    </div>
  </form>

  <button id="setup" type="button" hidden>Sign in / Complete setup ↗</button>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="retry" type="button" hidden>Try again</button>
  <footer id="keyboard-hint" hidden>Enter to send · Shift+Enter for a new line</footer>
  <script src="popup.js"></script>
</body>
</html>
